version: "3.9"
services:
  app:
    image: node:22-alpine
    container_name: capybara-api
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true   # fuerza polling para detectar cambios en Docker
    volumes:
      - .:/usr/src/app             # monta tu código local
      - /usr/src/app/node_modules  # volumen anónimo para node_modules dentro del contenedor
    command: sh -c "yarn install && yarn start:dev"
